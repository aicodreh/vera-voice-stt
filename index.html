<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vera Voice STT Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            max-width: 600px;
            width: 100%;
            text-align: center;
        }
        
        h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            color: #5BA4B5;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 2rem;
        }
        
        .status {
            padding: 10px 20px;
            border-radius: 20px;
            background: #1a1a1a;
            display: inline-block;
            margin-bottom: 2rem;
            font-size: 0.9rem;
        }
        
        .status.connected {
            color: #4ade80;
        }
        
        .status.disconnected {
            color: #f87171;
        }
        
        .status.listening {
            color: #facc15;
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .mic-button {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #5BA4B5, #4a8a99);
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 2rem;
        }
        
        .mic-button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(91, 164, 181, 0.4);
        }
        
        .mic-button.listening {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            animation: pulse-ring 1.5s infinite;
        }
        
        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { box-shadow: 0 0 0 20px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        
        .mic-button svg {
            width: 40px;
            height: 40px;
            fill: white;
        }
        
        .transcript-box {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 20px;
            min-height: 150px;
            text-align: left;
        }
        
        .transcript-box h3 {
            color: #5BA4B5;
            margin-bottom: 10px;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .transcript-text {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #e0e0e0;
        }
        
        .transcript-text.interim {
            color: #888;
            font-style: italic;
        }
        
        .transcript-text.final {
            color: #4ade80;
        }
        
        .instructions {
            margin-top: 2rem;
            color: #666;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔷 Vera Voice STT</h1>
        <p class="subtitle">Deepgram Speech-to-Text Test Module</p>
        
        <div class="status disconnected" id="status">Disconnected</div>
        
        <button class="mic-button" id="micButton" disabled>
            <svg viewBox="0 0 24 24">
                <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.36-.98.85C16.52 14.2 14.47 16 12 16s-4.52-1.8-4.93-4.15c-.08-.49-.49-.85-.98-.85-.61 0-1.09.54-1 1.14.49 3 2.89 5.35 5.91 5.78V20c0 .55.45 1 1 1s1-.45 1-1v-2.08c3.02-.43 5.42-2.78 5.91-5.78.1-.6-.39-1.14-1-1.14z"/>
            </svg>
        </button>
        
        <div class="transcript-box">
            <h3>Transcript</h3>
            <p class="transcript-text" id="transcript">Press the microphone button to start speaking...</p>
        </div>
        
        <p class="instructions">
            Click the mic button to start/stop recording. Speak clearly into your microphone.
        </p>
    </div>

    <script>
        const micButton = document.getElementById('micButton');
        const statusEl = document.getElementById('status');
        const transcriptEl = document.getElementById('transcript');
        
        let websocket = null;
        let mediaRecorder = null;
        let audioContext = null;
        let isListening = false;
        
        // Determine WebSocket URL based on current location
        const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${wsProtocol}//${window.location.host}/listen`;
        
        // Connect to WebSocket
        function connect() {
            websocket = new WebSocket(wsUrl);
            
            websocket.onopen = () => {
                console.log('WebSocket connected');
                statusEl.textContent = 'Connected - Ready';
                statusEl.className = 'status connected';
                micButton.disabled = false;
            };
            
            websocket.onmessage = (event) => {
                const data = JSON.parse(event.data);
                console.log('Received:', data);
                
                if (data.type === 'transcript') {
                    transcriptEl.textContent = data.text;
                    transcriptEl.className = data.is_final ? 'transcript-text final' : 'transcript-text interim';
                } else if (data.type === 'final_transcript') {
                    transcriptEl.textContent = data.text;
                    transcriptEl.className = 'transcript-text final';
                } else if (data.type === 'status') {
                    console.log('Status:', data.message);
                } else if (data.type === 'error') {
                    console.error('Error:', data.message);
                    statusEl.textContent = 'Error: ' + data.message;
                    statusEl.className = 'status disconnected';
                }
            };
            
            websocket.onclose = () => {
                console.log('WebSocket disconnected');
                statusEl.textContent = 'Disconnected';
                statusEl.className = 'status disconnected';
                micButton.disabled = true;
                stopListening();
                
                // Reconnect after 2 seconds
                setTimeout(connect, 2000);
            };
            
            websocket.onerror = (error) => {
                console.error('WebSocket error:', error);
            };
        }
        
        // Start listening
        async function startListening() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    audio: {
                        channelCount: 1,
                        sampleRate: 16000,
                        echoCancellation: true,
                        noiseSuppression: true
                    } 
                });
                
                audioContext = new AudioContext({ sampleRate: 16000 });
                const source = audioContext.createMediaStreamSource(stream);
                const processor = audioContext.createScriptProcessor(4096, 1, 1);
                
                processor.onaudioprocess = (e) => {
                    if (websocket && websocket.readyState === WebSocket.OPEN) {
                        const inputData = e.inputBuffer.getChannelData(0);
                        
                        // Convert float32 to int16
                        const int16Data = new Int16Array(inputData.length);
                        for (let i = 0; i < inputData.length; i++) {
                            const s = Math.max(-1, Math.min(1, inputData[i]));
                            int16Data[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
                        }
                        
                        // Send binary audio data
                        websocket.send(int16Data.buffer);
                    }
                };
                
                source.connect(processor);
                processor.connect(audioContext.destination);
                
                isListening = true;
                micButton.classList.add('listening');
                statusEl.textContent = 'Listening...';
                statusEl.className = 'status listening';
                transcriptEl.textContent = '';
                transcriptEl.className = 'transcript-text';
                
                // Store references for cleanup
                micButton.stream = stream;
                micButton.processor = processor;
                micButton.source = source;
                
            } catch (error) {
                console.error('Error accessing microphone:', error);
                statusEl.textContent = 'Microphone access denied';
                statusEl.className = 'status disconnected';
            }
        }
        
        // Stop listening
        function stopListening() {
            if (micButton.stream) {
                micButton.stream.getTracks().forEach(track => track.stop());
            }
            if (micButton.processor) {
                micButton.processor.disconnect();
            }
            if (micButton.source) {
                micButton.source.disconnect();
            }
            if (audioContext) {
                audioContext.close();
                audioContext = null;
            }
            
            isListening = false;
            micButton.classList.remove('listening');
            
            if (websocket && websocket.readyState === WebSocket.OPEN) {
                statusEl.textContent = 'Connected - Ready';
                statusEl.className = 'status connected';
            }
        }
        
        // Toggle listening
        micButton.addEventListener('click', () => {
            if (isListening) {
                stopListening();
            } else {
                startListening();
            }
        });
        
        // Initial connection
        connect();
    </script>
</body>
</html>
